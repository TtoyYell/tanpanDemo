<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="《谈判模拟》玩法试玩版：调查信息、找出矛盾，与供应商和税务官谈成协议。"
    />
    <title>谈判模拟</title>
    <link rel="stylesheet" href="./styles.css?v=13" />
  </head>
  <body>
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#" aria-label="返回游戏首页" id="brand-home">
        <span class="brand-mark" aria-hidden="true">谈</span>
        <span>
          <strong>谈判模拟</strong>
          <small>调查 · 谈判 · 结算</small>
        </span>
      </a>

      <div class="resource-strip" aria-label="经营资源">
        <div>
          <span>可用资金</span>
          <strong id="funds-value">¥268,000</strong>
        </div>
        <div>
          <span>商业声誉</span>
          <strong id="reputation-value">62</strong>
        </div>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="./game.js?v=13"></script>
  </body>
</html>
